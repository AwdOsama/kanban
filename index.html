<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./src/css/output.css" rel="stylesheet" />
    <link rel="stylesheet" href="./src/css/style.css" />
    <link
      rel="stylesheet"
      href="../node_modules/@fortawesome/fontawesome-free/css/all.min.css"
    />
    <title>Kanban</title>
  </head>
  <body class="min-h-screen flex flex-col">
    <header>
      <nav
        class="bg-linear-to-r from-indigo-600 to-purple-600 text-white shadow-md fixed top-0 z-30 w-full"
      >
        <div
          class="container max-w-7xl mx-auto py-3 px-4 flex items-center justify-between"
        >
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-table-columns text-2xl"></i>

            <h1 class="text-2xl font-bold">Kanban</h1>
          </div>
          <div class="flex items-center justify-center">
            <button
              class="w-10 h-10 rounded-lg cursor-pointer bg-white/20 hover:bg-white/30 transition-colors flex items-center justify-center"
              id="add-task-btn"
            >
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
        </div>
      </nav>
    </header>
    <div
      id="modal-overlay"
      class="fixed inset-0 z-50 flex hidden items-center justify-center bg-black/50 p-4"
    >
      <div
        id="task-modal"
        class="w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-2xl bg-white shadow-xl"
      >
        <div
          class="flex items-center justify-between border-b border-slate-200 p-5"
        >
          <h2
            id="modal-title"
            class="flex items-center gap-2 text-lg font-semibold text-slate-800"
          >
            Create New Task
          </h2>

          <button
            type="button"
            id="close-modal-btn"
            class="flex h-8 w-8 items-center justify-center rounded-lg text-slate-400 transition-colors hover:bg-slate-100 hover:text-slate-600"
          >
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>

        <form id="task-form" class="p-5">
          <div class="mb-4">
            <label
              for="task-title"
              class="mb-2 flex items-center gap-2 text-sm font-medium text-slate-700"
            >
              <i class="fa-solid fa-heading text-slate-400"></i>

              Task Title

              <span class="text-red-500">*</span>
            </label>

            <input
              type="text"
              id="task-title"
              name="title"
              placeholder="What needs to be done?"
              class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none transition-all placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500"
            />

            <p id="title-error" class="mt-1 hidden text-xs text-red-500"></p>
          </div>

          <div class="mb-4 grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div>
              <label
                for="task-priority"
                class="mb-2 flex items-center gap-2 text-sm font-medium text-slate-700"
              >
                <i class="fa-solid fa-flag text-slate-400"></i>

                Priority
              </label>

              <select
                id="task-priority"
                name="priority"
                class="w-full cursor-pointer rounded-lg border border-slate-300 bg-white px-4 py-2.5 outline-none transition-all focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500"
              >
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>

            <div>
              <label
                for="task-due-date"
                class="mb-2 flex items-center gap-2 text-sm font-medium text-slate-700"
              >
                <i class="fa-regular fa-calendar text-slate-400"></i>

                Due Date
              </label>

              <input
                type="date"
                id="task-due-date"
                name="dueDate"
                class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none transition-all focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500"
              />

              <p id="date-error" class="mt-1 hidden text-xs text-red-500"></p>
            </div>
          </div>

          <div class="mb-5">
            <label
              for="task-description"
              class="mb-2 flex items-center gap-2 text-sm font-medium text-slate-700"
            >
              <i class="fa-solid fa-align-left text-slate-400"></i>

              Description
            </label>

            <textarea
              id="task-description"
              name="description"
              rows="3"
              maxlength="500"
              placeholder="Add more details about this task..."
              class="w-full resize-none rounded-lg border border-slate-300 px-4 py-2.5 outline-none transition-all placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500"
            ></textarea>

            <div class="mt-1 flex items-center justify-between">
              <p id="description-error" class="hidden text-xs text-red-500"></p>

              <p id="char-count" class="ml-auto text-xs text-slate-400">
                0/500
              </p>
            </div>
          </div>

          <div class="flex gap-3">
            <button
              type="button"
              id="cancel-btn"
              class="flex-1 rounded-lg bg-slate-100 px-4 py-2.5 font-medium text-slate-700 transition-colors hover:bg-slate-200"
            >
              Cancel
            </button>

            <button
              type="submit"
              id="submit-btn"
              class="flex flex-1 items-center justify-center gap-2 rounded-lg bg-indigo-600 px-4 py-2.5 font-medium text-white transition-colors hover:bg-indigo-700"
            >
              <i class="fa-solid fa-plus"></i>

              <span id="submit-btn-text"> Add Task </span>
            </button>
          </div>
        </form>
      </div>
    </div>
    <main class="mt-24">
      <div
        id="columns"
        class="mx-auto grid max-w-7xl grid-cols-1 gap-6 md:grid-cols-3"
      >
        <section
          id="todo-column"
          class="flex `min-h-125` flex-col rounded-2xl border border-slate-200/50 bg-white/60 p-5 shadow-sm"
        >
          <div class="mb-5 flex items-center gap-3">
            <div
              class="flex h-10 w-10 items-center justify-center rounded-xl bg-slate-100"
            >
              <i class="fa-solid fa-clipboard-list text-lg text-slate-500"></i>
            </div>

            <div class="flex-1">
              <h2 class="font-semibold text-slate-800 ">To Do</h2>

              <p id="todo-count" class="text-xs text-slate-400">2 tasks</p>
            </div>
          </div>

          <div
            id="todo-tasks"
            class="flex flex-1 flex-col gap-4 overflow-y-auto pr-1"
          ></div>
        </section>

        <section
          id="progress-column"
          class="flex `min-h-125` flex-col rounded-2xl border border-slate-200/50 bg-white/60 p-5 shadow-sm"
        >
          <div class="mb-5 flex items-center gap-3">
            <div
              class="flex h-10 w-10 items-center justify-center rounded-xl bg-amber-50"
            >
              <i class="fa-solid fa-spinner text-lg text-amber-500"></i>
            </div>

            <div class="flex-1">
              <h2 class="font-semibold text-slate-800">In Progress</h2>

              <p id="progress-count" class="text-xs text-slate-400">1 task</p>
            </div>
          </div>

          <div
            id="progress-tasks"
            class="flex flex-1 flex-col gap-4 overflow-y-auto pr-1"
          ></div>
        </section>

        <section
          id="completed-column"
          class="flex min-h-[500px] flex-col rounded-2xl border border-slate-200/50 bg-white/60 p-5 shadow-sm"
        >
          <div class="mb-5 flex items-center gap-3">
            <div
              class="flex h-10 w-10 items-center justify-center rounded-xl bg-emerald-50"
            >
              <i class="fa-solid fa-circle-check text-lg text-emerald-500"></i>
            </div>

            <div class="flex-1">
              <h2 class="font-semibold text-slate-800">Completed</h2>

              <p id="completed-count" class="text-xs text-slate-400">1 task</p>
            </div>
          </div>

          <div
            id="completed-tasks"
            class="flex flex-1 flex-col gap-4 overflow-y-auto pr-1"
          ></div>
        </section>
      </div>
    </main>
    <footer
      class="mt-auto bg-gradient-to-r from-slate-800 to-slate-900 py-5 text-center"
    >
      <p class="flex items-center justify-center gap-2 text-sm text-slate-400">
        Made with
        <i class="fa-solid fa-heart animate-pulse text-rose-500"></i>
        by Route Academy
      </p>
    </footer>
    <script src="../src/js/index.js"></script>
  </body>
</html>
